<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<title>코끼리 그리기 – 발산에서 정리까지</title>
<style>
:root{--bg:#fff8ef;--sf:#fffdf9;--tx:#3d3129;--mu:#8c7b6b;--bd:#f5dfc3;--ac:#e8750f;--onac:#fff;--g1:#35c4b0;--g2:#9b7bff;--g3:#ffa24c;--un:#ffc83d;--wd:#ff5fa8;--ok:#2fb66f;--er:#ef5a5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1b19;--sf:#2a2522;--tx:#f6efe8;--mu:#bba99a;--bd:#473e38;--ac:#ffa94d;--onac:#2b1a08}}
:root[data-theme="dark"]{--bg:#1f1b19;--sf:#2a2522;--tx:#f6efe8;--mu:#bba99a;--bd:#473e38;--ac:#ffa94d;--onac:#2b1a08}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 0,#ffe2c055 0,transparent 38%),radial-gradient(circle at 95% 12%,#ffecb855 0,transparent 35%),var(--bg);color:var(--tx);font:15px/1.6 "Gowun Dodum","Pretendard","Noto Sans KR",system-ui,sans-serif;padding-bottom:130px}
header{padding:16px 20px 4px;max-width:980px;margin:auto}h1{font-family:"Jua","Gowun Dodum",system-ui,sans-serif;font-size:27px;margin:0;color:var(--ac)}header p{margin:2px 0 0;color:var(--mu);font-size:13px}
main{max-width:980px;margin:auto;padding:12px 20px}
.card{background:var(--sf);border:2px solid var(--bd);border-radius:22px;padding:16px 18px;margin-bottom:14px;box-shadow:0 4px 0 var(--bd)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}.steps span{font-size:13px;padding:5px 12px;border-radius:99px;border:2px solid var(--bd);color:var(--mu);background:var(--sf)}.steps .on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:2px solid var(--bd);border-radius:16px;padding:9px 13px;outline:none}input:focus,textarea:focus{border-color:var(--ac)}textarea{min-height:70px;resize:vertical}
button{font:inherit;cursor:pointer;border:2px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:99px;padding:7px 16px;box-shadow:0 3px 0 var(--bd);transition:transform .12s}button:hover:not(:disabled){transform:translateY(-2px)}button:active:not(:disabled){transform:translateY(2px);box-shadow:none}button.pri{background:linear-gradient(135deg,#ffb04d,#e8750f);border-color:#cf6208;color:#fff;box-shadow:0 3px 0 #cf6208}button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>input{flex:1;min-width:140px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.chip{display:inline-block;font-size:12.5px;padding:3px 11px;border-radius:99px;background:var(--bg);border:2px solid var(--bd);margin:2px 4px 2px 0}
.kc{border-left:5px solid var(--c,var(--ac));cursor:pointer;margin:0;min-height:86px}.kc h4{margin:0 0 4px;font-size:15px}.kc small{color:var(--mu)}.kc.uni{background:color-mix(in srgb,var(--un) 18%,var(--sf));border-color:var(--un)}
.msg{font-size:13px;margin:8px 0;color:var(--mu)}.msg.er{color:var(--er)}.msg.ok{color:var(--ok)}
svg{width:100%;height:auto;background:radial-gradient(var(--bd) 1.4px,transparent 1.7px) 0 0/22px 22px,var(--sf);border:2px solid var(--bd);border-radius:22px;touch-action:none}
svg text{fill:var(--tx);font-size:13px;pointer-events:none;font-family:inherit}
.nav{display:flex;justify-content:space-between;margin-top:10px;gap:8px}
#tl{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:2px solid var(--bd);border-radius:22px 22px 0 0;box-shadow:0 -4px 16px rgba(232,117,15,.18);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
#tl .in{max-width:980px;margin:auto;display:flex;gap:6px;overflow-x:auto;align-items:center}#tl b{font-size:12px;color:var(--mu);white-space:nowrap}
.tn{white-space:nowrap;font-size:12.5px;padding:5px 12px;border-radius:99px;border:2px solid var(--bd);background:var(--bg);cursor:pointer}.tn.cur{border-color:var(--ac);color:var(--ac)}.tn.empty{opacity:.5}
.q{cursor:pointer}.q.sel{outline:2px solid var(--ac)}.q .t{font-size:11px;color:var(--ac);font-weight:600}
.tline{border-left:3px solid var(--bd);margin-left:6px;padding-left:14px}.tline div{margin:0 0 12px;position:relative}.tline div:before{content:"";position:absolute;left:-21px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--ac)}.tline .gap:before{background:var(--wd)}.tline .gap{color:var(--wd)}
.final{font-size:16px;line-height:1.75;white-space:pre-wrap}
#tlsm{max-width:980px;margin:6px auto 0;font-size:12.5px;color:var(--mu);cursor:pointer;max-height:38vh;overflow:auto}#tlsm b{color:var(--tx)}#tlsm .one{display:inline-block;max-width:100%;vertical-align:bottom;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#tlsm div div{margin:2px 0}
</style></head><body>
<header><h1>🐘 코끼리 그리기</h1><p>각자 낸 아이디어 한 조각을 모아, 눈먼 이들이 코끼리 전체를 그려 가듯 하나의 결론으로 정리합니다.</p><div id="rs" style="margin-top:8px"></div><div id="sv"></div></header>
<main id="app"></main>

<div id="tl"><div class="in" id="tlin"></div><div id="tlsm"></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={topic:"",ideas:[],groups:[],links:[],pos:{},wild:[],trunk:[],p1ok:false,qs:[],concl:"",gaps:[],stale:true,page:1,step:1,sel:null,note:"",team:[],c1:"",c1Stale:false,fq:{list:[]},lq:{},who:"",fills:[]};
let AIREADY=null,BUSY=false;
try{const r=localStorage.getItem("ideaflow");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem("ideaflow",JSON.stringify(S))}catch(e){}}
async function getAI(){if(AIREADY!==null)return AIREADY;try{AIREADY=(window.claude&&await claude.use("sample"))||false}catch(e){AIREADY=false}return AIREADY}
async function ask(prompt){const a=await getAI();if(!a)return null;try{return await a.json(prompt)}catch(e){return null}}
function touch(){S.stale=true;save();}
function nodes(){const n=[];if(S.topic)n.push({id:"T",kw:S.topic,type:"topic"});S.ideas.forEach(i=>n.push({id:i.id,kw:i.kw,type:uniq(i.id)?"uni":"idea",g:gidx(i.id)}));S.wild.forEach(w=>n.push({id:w.id,kw:w.kw,type:"wild"}));return n}
const gidx=id=>S.groups.findIndex(g=>g.ids.includes(id));
const uniq=id=>{const g=S.groups[gidx(id)];return !g||g.ids.length<2};
const GC=["--g1","--g2","--g3","--ac"];
function sim(a,b){const bg=s=>{s=s.replace(/\s/g,"");const r=new Set();for(let i=0;i<s.length-1;i++)r.add(s.slice(i,i+2));return r};const A=bg(a),B=bg(b);if(!A.size||!B.size)return a===b?1:0;let c=0;A.forEach(x=>B.has(x)&&c++);return c/Math.min(A.size,B.size)}
function localGroup(){const ids=S.ideas.map(i=>i.id),seen=new Set(),out=[];ids.forEach(id=>{if(seen.has(id))return;const A=S.ideas.find(i=>i.id===id);const m=[id];seen.add(id);ids.forEach(o=>{if(seen.has(o))return;const B=S.ideas.find(i=>i.id===o);if(sim(A.kw+A.detail.slice(0,10),B.kw)>=.5||sim(A.kw,B.kw)>=.5){m.push(o);seen.add(o)}});out.push({label:m.length>1?A.kw+" 계열":A.kw,ids:m,summary:A.detail?A.detail.slice(0,50):A.kw})});return out}
function degree(){const d={};S.links.forEach(([a,b])=>{d[a]=(d[a]||0)+1;d[b]=(d[b]||0)+1});return d}
function topNodes(){const d=degree();return Object.keys(d).filter(k=>k!=="T").sort((a,b)=>d[b]-d[a]).slice(0,3)}
const kwOf=id=>(nodes().find(n=>n.id===id)||{}).kw||"";
function layout(){const ns=nodes();ns.forEach((n,i)=>{if(S.pos[n.id])return;if(n.id==="T")S.pos.T={x:350,y:210};else{const k=ns.length-1,a=(i-1)/Math.max(k,1)*Math.PI*2-1.2;S.pos[n.id]={x:350+Math.cos(a)*250,y:210+Math.sin(a)*150}}})}
const POOL=["자판기","해파리","한밤의 도서관","거꾸로 가는 시계","화산","빵집","우주정거장","고양이 택시","비 오는 날","곰팡이","오케스트라","자전거 펌프"];

/* ---------- render ---------- */
function render(){const A=$("#app");
if(S.page===1)A.innerHTML=p1();else if(S.page===2)A.innerHTML=p2();else if(S.page===3)A.innerHTML=p3();else A.innerHTML=p4();
bind();tl();rs();sv()}
function stepsBar(n,arr){return '<div class="steps">'+arr.map((t,i)=>`<span class="${i+1===n?"on":""}">${i+1}. ${t}</span>`).join("")+'</div>'}
function p1(){const st=S.step,h=`<div class="card"><b>PAGE 1 · 키워드 마인드맵</b>`+stepsBar(st,["의견 투입","AI 카드 요약","마인드맵 연결","엉뚱한 키워드 · 연결 질문","투표 · 결론 · 동의"])+"</div>";
if(st===1)return h+`<div class="card"><label>중심 주제</label><input id="topic" value="${esc(S.topic)}" placeholder="예: 우리 동네 도서관 활성화"><div class="row" style="margin-top:10px"><input id="kw" placeholder="키워드"><input id="dt" placeholder="상세 설명(선택)"><button class="pri" id="add">추가</button></div><p class="msg">키워드마다 상세 설명을 적어두면 카드를 눌렀을 때 전문이 보입니다.</p>${S.ideas.map(i=>`<span class="chip">${esc(i.kw)} <span data-ed="${i.id}" style="cursor:pointer">✎</span> <a href="#" data-del="${i.id}" style="text-decoration:none">✕</a></span>`).join("")}${kwEd()}</div><div class="nav"><span></span><button class="pri" id="to2" ${S.ideas.length<3||!S.topic?"disabled":""}>AI 카드 만들기 (키워드 3개 이상)</button></div>`;
if(st===2)return h+`<div class="card"><span class="chip" style="border-color:var(--un)">🟡 노란색 = 한 명만 낸 고유 아이디어</span><span class="chip">같은 색 막대 = AI가 묶은 비슷한 아이디어</span><p class="msg">${S.note||""}카드를 누르면 상세 설명이 열립니다. ✎로 수정·삭제할 수 있어요.</p></div>${kwEd()}${S.groups.map((g,gi)=>`<div class="card"><b style="color:var(${GC[gi%4]})">${esc(g.label)}</b> <small class="msg">${esc(g.summary||"")}</small><div class="grid" style="margin-top:8px">${g.ids.map(id=>{const i=S.ideas.find(x=>x.id===id);return i?`<div class="card kc ${g.ids.length<2?"uni":""}" style="--c:var(${g.ids.length<2?"--un":GC[gi%4]})" data-flip="${id}"><h4>${esc(i.kw)} <span data-ed="${id}" style="cursor:pointer;font-size:12px">✎</span></h4><small class="d" id="d${id}">${esc((i.detail||"").slice(0,26)||"(설명 없음)")}…</small></div>`:""}).join("")}</div></div>`).join("")}<div class="nav"><button id="b1">← 수정</button><button class="pri" id="to3">마인드맵으로 연결 →</button></div>`;
if(st===3){layout();return h+`<div class="card"><p class="msg" style="margin-top:0">노드를 드래그해 배치하고, 두 노드를 차례로 클릭하면 선으로 연결(다시 연결하면 해제)됩니다. 선택: <b>${esc(S.sel?kwOf(S.sel):"없음")}</b></p>${svg()}${linkEd()}${kwEd()}</div><div class="nav"><button id="b2">← 카드</button><button class="pri" id="to4" ${S.links.length<2?"disabled":""}>다음 (연결 2개 이상) →</button></div>`}
if(st===5)return h+p1s5();const tn=topNodes();return h+`<div class="card"><button id="wild">🎲 엉뚱한 키워드 던지기</button> <span class="msg">AI가 뜬금없는 키워드를 몇몇 카드에 붙입니다. 엉뚱한 키워드끼리는 연결할 수 없고, 기존 키워드에만 붙일 수 있어요.</span>${S.wild.length?svg()+linkEd()+kwEd():""}</div>${lqUI()}<div class="nav"><button id="b3">← 마인드맵</button><button class="pri" id="to5">다음: 투표 · 결론 · 동의 →</button></div>`}
let svOpen=false,svName="",svMsg="",svText="";const SK="ideaflow_saves";
function getSaves(){try{return JSON.parse(localStorage.getItem(SK)||"[]")}catch(e){return []}}
function putSaves(a){try{localStorage.setItem(SK,JSON.stringify(a));return true}catch(e){svMsg="브라우저 저장공간을 쓸 수 없어요. 파일로 내보내 주세요.";return false}}
function defS(){return {topic:"",ideas:[],groups:[],links:[],pos:{},wild:[],trunk:[],p1ok:false,qs:[],concl:"",gaps:[],stale:true,page:1,step:1,sel:null,note:"",team:[],c1:"",c1Stale:false,fq:{list:[]},lq:{},who:"",fills:[]}}
function fnm(){return (S.topic||"논의").replace(/[^0-9A-Za-z가-힣]+/g,"-").slice(0,30)}
function snapMd(){const f=S.fin||{},L=["# "+(S.topic||"논의 정리")];
if(f.head)L.push("\n**"+f.head+"**");
L.push("\n## 회의 내용 요약\n"+(f.recap||tlSteps().join("\n")));
L.push("\n## 우리가 도출한 결론\n"+(f.body||S.concl||S.c1||"(아직 결론이 없습니다)"));
if(S.ideas.length)L.push("\n## 키워드\n"+S.ideas.map(i=>"- "+i.kw+(i.detail?": "+i.detail:"")).join("\n"));
if(S.wild.length)L.push("\n## 엉뚱한 키워드\n"+S.wild.map(w=>"- "+w.kw).join("\n"));
if(S.links.length)L.push("\n## 연결\n"+S.links.map(l=>"- "+kwOf(l[0])+" ↔ "+kwOf(l[1])+(l[3]?" (👍 "+l[3]+")":"")+(l[2]?" — "+l[2]:"")).join("\n"));
const q=lqList();if(q.length)L.push("\n## 연결 질문과 답변\n"+q.map(x=>"- **"+x.연결+"** "+x.질문+"\n"+x.답변.map(a=>"  - "+a).join("\n")).join("\n"));
if(fql().length)L.push("\n## 흐름 점검\n"+fql().map(x=>"- "+x.q+"\n  - "+(x.a||"")).join("\n"));
if((f.next||[]).length)L.push("\n## 다음 한 걸음\n"+f.next.map((x,i)=>(i+1)+". "+x).join("\n"));
return L.join("\n")+"\n\n---\n"+CR()}
async function dl(name,data){svText="";try{const d=window.claude&&await claude.use("downloads");if(!d)throw {code:"none"};await d.save({filename:name,data});svMsg="파일 저장을 요청했어요. 나타난 확인 창에서 허용해 주세요."}catch(e){const c=e&&e.code;if(c==="declined")svMsg="저장을 취소했어요.";else{svMsg="이 화면에서는 파일 저장이 막혀 있어요"+(c&&c!=="none"?" (오류: "+c+")":"")+". 아래 내용을 복사해서 메모장에 "+name.split(".").pop()+" 파일로 저장해 두세요.";svText=data;try{await navigator.clipboard.writeText(data);svMsg+=" (클립보드에도 복사했어요)"}catch(x){}}}sv()}
function sv(){const e=$("#sv"),L=getSaves(),$i=id=>document.getElementById(id);
if(!svOpen){e.innerHTML=`<button id="svb" style="margin-top:8px">💾 저장 · 불러오기</button>`;$i("svb").onclick=()=>{svOpen=true;svMsg="";sv()};return}
e.innerHTML=`<div class="card" style="margin-top:10px"><b>💾 저장 · 불러오기</b> <button id="svx" style="float:right">닫기</button><div class="row" style="margin-top:8px"><input id="svn" placeholder="저장 이름 (비우면 주제로 저장)" value="${esc(svName)}"><button class="pri" id="svs">현재 논의 저장</button></div>${L.length?L.map((x,i)=>`<div class="row" style="margin-top:6px"><span style="flex:1"><b>${esc(x.name)}</b> <span class="msg">${esc(x.t)}</span></span><button data-sl="${i}">불러오기</button><button data-sd="${i}">삭제</button></div>`).join(""):'<p class="msg">저장된 논의가 없습니다.</p>'}<div class="row" style="margin-top:10px"><button id="svj">파일로 내보내기(.json)</button><button id="svm">정리 문서 내보내기(.md)</button><label style="cursor:pointer"><span style="border:1px solid var(--bd);border-radius:10px;padding:8px 14px;display:inline-block">파일 불러오기(.json)</span><input type="file" id="svf" accept=".json" style="display:none"></label></div><p class="msg">브라우저 저장은 이 기기에만 남아요. 다른 기기나 팀과 나눠야 하면 파일로 내보내세요.</p><p class="msg ok" id="svmsg">${esc(svMsg)}</p>${svText?`<textarea readonly onclick="this.select()" style="min-height:120px;font-size:12px">${esc(svText)}</textarea>`:""}<textarea id="svp" placeholder="저장해 둔 .json 내용을 여기에 붙여넣어 불러오기" style="min-height:60px;margin-top:8px"></textarea><button id="svpb" style="margin-top:6px">붙여넣은 내용으로 불러오기</button></div>`;
$i("svpb").onclick=()=>{try{const d=JSON.parse($i("svp").value);if(!d||typeof d!=="object"||!("ideas" in d))throw 0;S=Object.assign(defS(),d);save();svMsg="";svOpen=false;BUSY=false;render()}catch(x){svMsg="올바른 저장 내용이 아니에요.";sv()}};
$i("svx").onclick=()=>{svOpen=false;sv()};
$i("svn").oninput=ev=>{svName=ev.target.value};
$i("svs").onclick=()=>{const name=svName.trim()||S.topic||"이름 없는 논의",a=getSaves();a.unshift({name,t:new Date().toLocaleString("ko-KR"),d:JSON.parse(JSON.stringify(S))});if(putSaves(a)){svMsg="저장했어요: "+name;svName=""}sv()};
document.querySelectorAll("[data-sl]").forEach(b=>b.onclick=()=>{const x=L[+b.dataset.sl];S=Object.assign(defS(),JSON.parse(JSON.stringify(x.d)));save();svMsg="";svOpen=false;BUSY=false;render()});
document.querySelectorAll("[data-sd]").forEach(b=>b.onclick=()=>{const a=getSaves();a.splice(+b.dataset.sd,1);putSaves(a);sv()});
$i("svj").onclick=()=>dl("ideaflow-"+fnm()+".json",JSON.stringify(Object.assign({_credit:CR()},S),null,2));
$i("svm").onclick=()=>dl("ideaflow-"+fnm()+".md",snapMd());
$i("svf").onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=="object"||!("ideas" in d))throw 0;S=Object.assign(defS(),d);save();svMsg="";svOpen=false;BUSY=false;render()}catch(x){svMsg="올바른 저장 파일이 아니에요.";sv()}};r.readAsText(f)}}
let rsAsk=false;
function resetAll(){S={topic:"",ideas:[],groups:[],links:[],pos:{},wild:[],trunk:[],p1ok:false,qs:[],concl:"",gaps:[],stale:true,page:1,step:1,sel:null,note:"",team:[],c1:"",c1Stale:false,fq:{list:[]},lq:{},who:"",fills:[]};try{localStorage.removeItem("ideaflow")}catch(e){}tlOpen=false;BUSY=false;window.scrollTo(0,0);render()}
